services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shares
      POSTGRES_PASSWORD: shares
      POSTGRES_DB: shares
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shares"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://shares:shares@db:5432/shares
      SECRET_KEY: change-me-in-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      # Schema is managed by Alembic via the entrypoint; skip create_all.
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
